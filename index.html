<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<title>IT ExamPro — Live Quiz</title>
<style>
:root{
  --bg:#0F172A;
  --bg2:#1E293B;
  --bg3:#334155;
  --blue:#3B82F6;
  --blue-d:#2563EB;
  --green:#10B981;
  --red:#EF4444;
  --amber:#F59E0B;
  --slate:#64748B;
  --text:#F1F5F9;
  --text2:#94A3B8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1.5rem;
  /* Subtle grid pattern background */
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(59,130,246,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(16,185,129,.06) 0%, transparent 50%);
}

/* Branding at top */
.brand{text-align:center;margin-bottom:1.5rem;}
.brand-logo{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:-1px;}
.brand-logo span{color:var(--blue);}
.brand-sub{font-size:.8rem;color:var(--text2);margin-top:3px;letter-spacing:.5px;text-transform:uppercase;}

/* Main card */
.card{
  background:var(--bg2);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:2rem;
  width:100%;
  max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.05) inset;
}

/* On PC - wider layout with side decoration */
@media(min-width:768px){
  body{flex-direction:row;gap:4rem;justify-content:center;align-items:center;}
  .brand{text-align:left;margin-bottom:0;max-width:300px;}
  .brand-logo{font-size:2.5rem;}
  .brand-desc{font-size:.95rem;color:var(--text2);margin-top:1rem;line-height:1.6;max-width:260px;}
  .card{max-width:400px;flex-shrink:0;}
}

.fl{font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}

.fi{
  width:100%;
  padding:12px 16px;
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:10px;
  background:rgba(255,255,255,.05);
  color:var(--text);
  font-size:1rem;
  font-weight:600;
  outline:none;
  transition:border-color .2s, background .2s;
  margin-bottom:1rem;
}
.fi:focus{border-color:var(--blue);background:rgba(59,130,246,.08);}
.fi-pin{
  font-size:2.2rem;
  font-weight:900;
  text-align:center;
  letter-spacing:10px;
  font-family:'Courier New',monospace;
  color:#fff;
}
select.fi{cursor:pointer;}
select.fi option{background:var(--bg2);color:var(--text);}
select.fi optgroup{color:var(--slate);}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
  transition:all .2s;
  margin-bottom:.5rem;
  letter-spacing:.3px;
}
.btn-blue{
  background:linear-gradient(135deg,var(--blue),var(--blue-d));
  color:#fff;
  box-shadow:0 4px 15px rgba(59,130,246,.3);
}
.btn-blue:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,.4);}
.btn-blue:disabled{background:var(--bg3);color:var(--slate);cursor:not-allowed;transform:none;box-shadow:none;}

.status{text-align:center;padding:.8rem;font-size:.85rem;color:var(--text2);font-weight:600;}
.status.error{color:var(--red);}
.status.success{color:var(--green);}

/* Lobby */
.lobby{text-align:center;padding:1rem 0;}
.name-badge{
  font-size:1.2rem;font-weight:900;color:#fff;
  background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(16,185,129,.15));
  border:1.5px solid rgba(59,130,246,.4);
  border-radius:12px;padding:.7rem 1.5rem;
  display:inline-block;margin-bottom:.8rem;
}
.waiting-text{font-size:.88rem;color:var(--text2);margin-top:.5rem;}
.pulse{animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* Question screen */
.question-screen{text-align:center;}
.q-label{font-size:.72rem;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.3rem;}
.q-timer{
  font-size:3rem;font-weight:900;
  font-family:'Courier New',monospace;
  margin-bottom:.3rem;
  color:#fff;
}

/* Answer buttons - good size for mobile & pc */
.answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:.8rem;}
.ans-btn{
  padding:1.5rem .8rem;
  border:none;
  border-radius:14px;
  font-size:.9rem;
  font-weight:800;
  color:#fff;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.5rem;
  transition:transform .12s, box-shadow .12s;
  min-height:100px;
  line-height:1.3;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.ans-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.4);}
.ans-btn:active:not(:disabled){transform:translateY(-1px);}
.ans-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.ans-btn.selected{outline:3px solid rgba(255,255,255,.9);outline-offset:2px;}
.ans-btn.correct{outline:3px solid var(--green);outline-offset:2px;}
.ans-btn.wrong{opacity:.3;}
.ans-icon{font-size:1.6rem;line-height:1;}
.ans-text{font-size:.82rem;font-weight:800;text-align:center;}

.ans-red{background:linear-gradient(135deg,#EF4444,#DC2626);}
.ans-blue{background:linear-gradient(135deg,#3B82F6,#2563EB);}
.ans-green{background:linear-gradient(135deg,#10B981,#059669);}
.ans-yellow{background:linear-gradient(135deg,#F59E0B,#D97706);}
.ans-purple{background:linear-gradient(135deg,#8B5CF6,#7C3AED);}
.ans-pink{background:linear-gradient(135deg,#EC4899,#DB2777);}

/* Timer bar */
.timer-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:6px;margin:.5rem 0 1rem;overflow:hidden;}
.timer-bar{height:100%;border-radius:999px;transition:width 1s linear,background .5s;}

/* Result */
.result-screen{text-align:center;padding:.5rem 0;}
.result-icon{font-size:3.5rem;margin-bottom:.5rem;}
.result-points{font-size:2.5rem;font-weight:900;color:var(--amber);margin:.3rem 0;}
.result-label{font-size:.9rem;color:var(--text2);margin-bottom:.3rem;}
.result-correct{font-size:1rem;font-weight:800;color:var(--green);margin:.4rem 0;}
.result-wrong{font-size:1rem;font-weight:800;color:var(--red);margin:.4rem 0;}

/* Final */
.final-screen{text-align:center;padding:1rem 0;}
.final-score{font-size:3rem;font-weight:900;color:var(--amber);margin:1rem 0;}

/* Cancelled */
.cancelled-screen{text-align:center;padding:2rem 0;}

/* Text inputs */
.fi-answer{
  width:100%;padding:12px;
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:10px;
  background:rgba(255,255,255,.05);
  color:var(--text);font-size:1rem;font-weight:600;
  outline:none;margin-bottom:.8rem;resize:vertical;
}
.fi-answer:focus{border-color:var(--blue);}

@media(max-width:400px){
  .card{padding:1.5rem;}
  .ans-btn{min-height:85px;padding:1rem .6rem;}
  .q-timer{font-size:2.5rem;}
}
</style>
</head>
<body>
<div class="card" id="app">
  <!-- JS renders into here -->
</div>

<script>
var SURL = 'https://script.google.com/macros/s/AKfycbxrrDxbVlTP1u5oyR776zVOfG3gTMK1mIPFeh9qFIbTFYaOA8RL5tFseH99-c0JTq7p/exec';

var state = 'join'; /* join | lobby | question | result | final | cancelled */
var studentId = 'st_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
var playerName = '';
var playerCls  = '';
var sessionPin = '';
var session    = null;
var currentQ   = -1;
var submitted  = false;
var myScore    = 0;
var lastGain   = 0;
var lastCorrect = null;
var questionStartTime = 0;
var pollTimer  = null;
var countdownTimer = null;
var timeLeft   = 0;
var selectedAnswer = null;

var COLORS = ['ans-red','ans-blue','ans-green','ans-yellow','ans-purple','ans-pink'];
var SHAPES = ['▲','◆','●','■','★','♥'];
var L = ['A','B','C','D','E','F'];

/* ── RENDER ── */
function render(){
  var el=document.getElementById('app');
  if(state==='join')     el.innerHTML=renderJoin();
  else if(state==='lobby')    el.innerHTML=renderLobby();
  else if(state==='question') el.innerHTML=renderQuestion();
  else if(state==='result')   el.innerHTML=renderResult();
  else if(state==='final')    el.innerHTML=renderFinal();
  else if(state==='cancelled') el.innerHTML=renderCancelled();
}

function renderJoin(){
  return '<div class="brand"><div class="brand-logo">Exam<span>Pro</span></div>'
    +'<div class="brand-sub">Live Quiz</div>'
    +'<div class="brand-desc">Enter your PIN to join your teacher\'s live quiz session.</div></div>'
    +'<div class="fl">Game PIN</div>'
    +'<input class="fi fi-pin" id="j-pin" type="tel" maxlength="6" placeholder="000000" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')">'
    +'<div class="fl">Your Full Name</div>'
    +'<input class="fi" id="j-name" type="text" placeholder="e.g. John Smith" autocomplete="off">'
    +'<div class="fl">Class</div>'
    +'<select class="fi" id="j-cls" style="cursor:pointer;">'
    +'<option value="">-- Select your class --</option>'
    +'<optgroup label="Grade 7"><option>7-1</option><option>7-2</option><option>7-3</option><option>7-4</option></optgroup>'
    +'<optgroup label="Grade 8"><option>8-1</option><option>8-2</option><option>8-3</option><option>8-4</option></optgroup>'
    +'<optgroup label="Grade 9"><option>9-1</option><option>9-2</option><option>9-3</option><option>9-4</option></optgroup>'
    +'<optgroup label="Grade 10"><option>10 Arts</option><option>10 Business</option><option>10 TVET 1</option><option>10 TVET 2</option><option>10 CVQ 1</option><option>10 CVQ 2</option></optgroup>'
    +'<optgroup label="Grade 11"><option>11 Arts</option><option>11 Business</option><option>11 TVET 1</option><option>11 TVET 2</option><option>11 CVQ 1</option><option>11 CVQ 2</option></optgroup>'
    +'</select>'
    +'<button class="btn btn-blue" onclick="joinGame()">Join</button>'
    +'<div id="j-status" class="status"></div>';
}

async function joinGame(){
  var pin=(document.getElementById('j-pin')||{}).value||'';
  var name=(document.getElementById('j-name')||{}).value||'';
  var cls=(document.getElementById('j-cls')||{}).value||'';
  if(!pin||pin.length!==6){setStatus('Enter the 6-digit PIN.','error');return;}
  if(!name.trim()){setStatus('Enter your full name.','error');return;}
  if(!cls.trim()){setStatus('Enter your class.','error');return;}

  setStatus('Joining...','');
  try{
    var joinParams='?action=lqJoin&pin='+encodeURIComponent(pin)
      +'&studentId='+encodeURIComponent(studentId)
      +'&name='+encodeURIComponent(name.trim())
      +'&cls='+encodeURIComponent(cls.trim())
      +'&t='+Date.now();
    var r=await fetch(SURL+joinParams,{method:'GET',mode:'cors'});
    var j=await r.json();
    if(!j.ok){setStatus(j.error||'Could not join.','error');return;}
    sessionPin=pin; playerName=name.trim(); playerCls=cls.trim();
    session=j.session;
    state='lobby';
    render();
    startPolling();
    /* Immediate first poll so student doesn't wait for interval */
    poll();
  }catch(e){setStatus('Connection error. Check your internet.','error');}
}

function setStatus(msg,type){
  var el=document.getElementById('j-status');
  if(el){el.textContent=msg;el.className='status'+(type?' '+type:'');}
}

/* ── LOBBY ── */
function renderLobby(){
  return '<div class="lobby">'
    +'<div style="font-size:.82rem;color:#64748b;margin-bottom:.8rem;">You\'re in! Waiting for the teacher to start...</div>'
    +'<div class="name-badge">'+esc(playerName)+'</div>'
    +'<div style="font-size:.76rem;color:#64748b;margin-bottom:1.5rem;">'+esc(playerCls)+'</div>'
    +'<div class="waiting pulse">⏳ Waiting for game to start...</div>'
    +'</div>';
}

/* ── QUESTION ── */
function renderQuestion(){
  if(!session) return '<div class="status">Loading...</div>';
  var q=null;
  try{ var qs=JSON.parse(session.questions||'[]'); q=qs[currentQ]; }catch(e){}
  if(!q) return '<div class="status">Loading question...</div>';

  var t=q.type;
  var h='<div class="question-screen">';
  h+='<div style="font-size:.76rem;color:#94a3b8;margin-bottom:.4rem;">Question '+(currentQ+1)+'</div>';
  h+='<div class="q-timer" id="q-timer" style="color:'+(timeLeft<=5?'#ef4444':timeLeft<=10?'#f59e0b':'#f59e0b')+'">'+timeLeft+'</div>';

  /* Timer bar */
  var timer=parseInt(session.timer)||30;
  var pct=Math.round(timeLeft/timer*100);
  h+='<div style="background:#334155;border-radius:999px;height:6px;margin-bottom:1rem;overflow:hidden;">';
  h+='<div id="q-bar" style="width:'+pct+'%;background:'+(pct>33?'#22c55e':pct>15?'#f59e0b':'#ef4444')+';height:100%;transition:width 1s linear;"></div></div>';

  if(submitted){
    h+='<div style="font-size:.9rem;color:#22c55e;font-weight:800;margin-bottom:1rem;">✅ Answer submitted! Waiting for results...</div>';
  }

  /* Answer UI */
  if(t==='mcq'||t==='ms'){
    h+='<div class="answers-grid">';
    (q.opts||[]).forEach(function(opt,i){
      var sel=submitted&&(Array.isArray(selectedAnswer)?selectedAnswer.indexOf(i)>=0:selectedAnswer==i);
      h+='<button class="ans-btn '+COLORS[i%COLORS.length]+(sel?' selected':'')
        +'" onclick="submitAns('+i+')" '+(submitted?'disabled':'')+'>'
        +'<span style="font-size:1.8rem;">'+SHAPES[i%SHAPES.length]+'</span>'
        +'<span style="font-size:.82rem;">'+esc(opt)+'</span></button>';
    });
    h+='</div>';
  } else if(t==='tf'){
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem;">';
    var trSel=submitted&&selectedAnswer===true;
    var flSel=submitted&&selectedAnswer===false;
    h+='<button class="ans-btn ans-green'+(trSel?' selected':'')
      +'" onclick="submitAns(true)" '+(submitted?'disabled':'')
      +' style="padding:1.5rem;font-size:1.3rem;flex-direction:column;">✓<br>TRUE</button>';
    h+='<button class="ans-btn ans-red'+(flSel?' selected':'')
      +'" onclick="submitAns(false)" '+(submitted?'disabled':'')
      +' style="padding:1.5rem;font-size:1.3rem;flex-direction:column;">✗<br>FALSE</button>';
    h+='</div>';
  } else if(t==='fill'||t==='essay'){
    h+='<div style="text-align:left;margin-bottom:.5rem;font-size:.8rem;color:#94a3b8;">'+(t==='fill'?'Type your answer:' :'Write your answer:')+'</div>';
    h+='<textarea class="fi-answer" id="ans-text" rows="'+(t==='essay'?4:2)+'" placeholder="Your answer..." '+(submitted?'disabled':'')+'></textarea>';
    h+='<button class="btn btn-blue" onclick="submitTextAns()" '+(submitted?'disabled':'')+'>Submit Answer</button>';
  } else if(t==='match'){
    h+='<div style="text-align:left;margin-bottom:.8rem;">';
    (q.pairs||[]).forEach(function(p,i){
      h+='<div style="margin-bottom:.5rem;">';
      h+='<div style="font-size:.8rem;color:#94a3b8;margin-bottom:3px;">'+esc(p.left)+'</div>';
      h+='<input class="fi" id="match-'+i+'" placeholder="Type the match..." '+(submitted?'disabled':'')+'style="margin-bottom:0;">';
      h+='</div>';
    });
    h+='</div>';
    h+='<button class="btn btn-blue" onclick="submitMatchAns()" '+(submitted?'disabled':'')+'>Submit Answers</button>';
  }

  h+='</div>';
  return h;
}

function submitAns(val){
  if(submitted) return;
  selectedAnswer=val;
  submitted=true;
  var elapsed=(Date.now()-questionStartTime)/1000;
  render(); /* Update UI immediately — no waiting */
  sendAnswer(val,elapsed); /* Fire and forget */
}
function submitTextAns(){
  if(submitted) return;
  var val=(document.getElementById('ans-text')||{}).value||'';
  if(!val.trim()){return;}
  submitted=true;
  var elapsed=(Date.now()-questionStartTime)/1000;
  render();
  sendAnswer(val.trim(),elapsed);
}
function submitMatchAns(){
  if(submitted) return;
  var pairs=[];
  var inputs=document.querySelectorAll('[id^="match-"]');
  inputs.forEach(function(inp){ pairs.push(inp.value.trim()); });
  submitted=true;
  var elapsed=(Date.now()-questionStartTime)/1000;
  render();
  sendAnswer(pairs,elapsed);
}

async function sendAnswer(answer,elapsed){
  try{
    var subParams='?action=lqSubmitAnswer&pin='+encodeURIComponent(sessionPin)
      +'&studentId='+encodeURIComponent(studentId)
      +'&questionIdx='+currentQ
      +'&answer='+encodeURIComponent(JSON.stringify(answer))
      +'&responseTime='+Math.round(elapsed*10)/10
      +'&t='+Date.now();
    await fetch(SURL+subParams,{method:'GET',mode:'cors'});
  }catch(e){ console.warn('submitAnswer error:',e); }
}

/* ── RESULT SCREEN ── */
function renderResult(){
  var icon=lastCorrect===null?'📝':lastCorrect?'✅':'❌';
  var label=lastCorrect===null?'Submitted!':lastCorrect?'Correct!':'Wrong!';
  var color=lastCorrect===null?'#94a3b8':lastCorrect?'#22c55e':'#ef4444';
  return '<div class="result-screen">'
    +'<div class="result-icon">'+icon+'</div>'
    +'<div class="result-label" style="color:'+color+';">'+label+'</div>'
    +(lastGain>0?'<div class="result-points">+'+lastGain+'</div>':'')
    +'<div class="result-total">Total: '+myScore+' points</div>'
    +'<div style="margin-top:1.5rem;font-size:.82rem;color:#64748b;" class="pulse">Waiting for next question...</div>'
    +'</div>';
}

/* ── FINAL SCREEN ── */
function renderCancelled(){
  return '<div class="cancelled-screen">'  
    +'<div style="font-size:3rem;margin-bottom:1rem;">🚫</div>'
    +'<div style="font-size:1.2rem;font-weight:900;color:#fff;margin-bottom:.5rem;">Session Ended</div>'
    +'<div style="font-size:.88rem;color:var(--slate);margin-bottom:1.5rem;">Your teacher has cancelled this session.</div>'
    +'<div style="font-size:.82rem;color:var(--slate);">Returning to join screen...</div>'
    +'</div>';
}

function renderFinal(){
  return '<div class="final-screen">'
    +'<div style="font-size:2.5rem;margin-bottom:.5rem;">🏆</div>'
    +'<div style="font-size:1.3rem;font-weight:900;margin-bottom:.3rem;">Game Over!</div>'
    +'<div style="font-size:.82rem;color:#64748b;margin-bottom:.5rem;">Your final score</div>'
    +'<div class="final-score">'+myScore+'</div>'
    +'<div style="font-size:.82rem;color:#64748b;margin-bottom:1.5rem;">points</div>'
    +'<div style="font-size:.88rem;color:#94a3b8;">'+esc(playerName)+' • '+esc(playerCls)+'</div>'
    +'</div>';
}

/* ── POLLING ── */
function startPolling(){
  stopPolling();
  /* 1s in lobby so question appears fast, 1.5s during question */
  pollTimer=setInterval(poll, state==='lobby'?1000:1500);
}
function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=null;
}

async function poll(){
  if(!sessionPin) return;
  try{
    var r=await fetch(SURL+'?action=lqGetSession&pin='+sessionPin+'&t='+Date.now(),{method:'GET',mode:'cors'});
    if(!r.ok) return;
    var j=await r.json();
    if(!j.ok||!j.session) return;
    var srv=j.session;
    session=srv;

    var srvStatus=srv.status;
    var srvQ=parseInt(srv.currentQ);

    /* Lobby → Question */
    if(state==='lobby'&&srvStatus==='question'){
      state='question';
      currentQ=srvQ;
      submitted=false;
      selectedAnswer=null;
      lastCorrect=null;
      /* Use full timer — admin controls reveal manually */
      timeLeft=parseInt(srv.timer)||30;
      questionStartTime=Date.now();
      render();
      startCountdown();
      stopPolling();
      pollTimer=setInterval(poll,1000);
      return;
    }

    /* New question while in result */
    if(state==='result'&&srvStatus==='question'&&srvQ!==currentQ){
      state='question';
      currentQ=srvQ;
      submitted=false;
      selectedAnswer=null;
      lastCorrect=null;
      /* Use full timer — admin controls reveal manually */
      timeLeft=parseInt(srv.timer)||30;
      questionStartTime=Date.now();
      render();
      startCountdown();
      stopPolling();
      pollTimer=setInterval(poll,1000);
      return;
    }

    /* Question → Reveal */
    if(state==='question'&&srvStatus==='reveal'){
      stopCountdown();
      /* Use correctAnswer sent from server */
      var correctAns=null;
      try{ correctAns=JSON.parse(srv.correctAnswer); }catch(e){ correctAns=srv.correctAnswer; }
      if(!submitted){
        lastCorrect=false; lastGain=0;
      } else {
        var q=null;
        try{ var qs=JSON.parse(srv.questions||'[]'); q=qs[currentQ]; }catch(e){}
        var qtype=q?q.type:'';
        if(qtype==='fill'||qtype==='essay'||qtype==='match'){
          lastCorrect=null; lastGain=0; /* server marks these */
        } else if(correctAns!==null&&correctAns!==undefined){
          /* Compare student answer against server correct answer */
          if(qtype==='tf'){
            lastCorrect=String(selectedAnswer)===String(correctAns);
          } else if(qtype==='ms'){
            var ca=(Array.isArray(correctAns)?correctAns:[]).slice().sort().join(',');
            var sa=(Array.isArray(selectedAnswer)?selectedAnswer:[]).slice().sort().join(',');
            lastCorrect=ca===sa;
          } else {
            lastCorrect=parseInt(selectedAnswer)===parseInt(correctAns);
          }
          if(lastCorrect){
            /* Read score from server to stay in sync with admin */
            var scores={};
            try{ scores=JSON.parse(srv.scores||'{}'); }catch(e){}
            var myData=scores[studentId];
            if(myData&&myData.lastGain){
              lastGain=myData.lastGain;
              myScore=myData.total;
            } else {
              /* Fallback: calculate locally */
              var timer=parseInt(srv.timer)||30;
              var elapsed=(Date.now()-questionStartTime)/1000;
              var mode=srv.scoreMode||'speed';
              if(mode==='speed'){
                lastGain=Math.max(500,Math.floor((1-(Math.min(elapsed,timer)/timer)/2)*1000));
              } else { lastGain=1000; }
              myScore+=lastGain;
            }
          } else { lastGain=0; }
        } else { lastCorrect=false; lastGain=0; }
      }
      state='result';
      render();
      startPolling();
      return;
    }

    /* Session ended */
    if(srvStatus==='ended'){
      stopPolling();
      stopCountdown();
      state='final';
      render();
      return;
    }
    /* Session cancelled by teacher */
    if(srvStatus==='cancelled'){
      stopPolling();
      stopCountdown();
      state='cancelled';
      render();
      /* Auto-reset to join screen after 3 seconds */
      setTimeout(function(){
        state='join';
        sessionPin='';
        submitted=false;
        selectedAnswer=null;
        myScore=0;
        lastGain=0;
        lastCorrect=null;
        render();
      },3000);
      return;
    }
  }catch(e){ console.warn('poll error:',e); }
}

function checkCorrect(q,ans){
  if(ans===null||ans===undefined) return false;
  var t=q.type;
  if(t==='mcq') return parseInt(ans)===parseInt(q.ans);
  if(t==='tf')  return String(ans)===String(q.ans);
  return false; /* fill/essay/match checked server-side */
}

/* ── COUNTDOWN ── */
function startCountdown(){
  stopCountdown();
  countdownTimer=setInterval(function(){
    timeLeft--;
    var td=document.getElementById('q-timer');
    var bar=document.getElementById('q-bar');
    var timer=session?parseInt(session.timer)||30:30;
    if(td){ td.textContent=timeLeft; td.style.color=timeLeft<=5?'#ef4444':timeLeft<=10?'#f59e0b':'#f59e0b'; }
    var pct=Math.round(timeLeft/timer*100);
    if(bar){ bar.style.width=pct+'%'; bar.style.background=pct>33?'#22c55e':pct>15?'#f59e0b':'#ef4444'; }
    if(timeLeft<=0){ stopCountdown(); if(!submitted){ submitted=true; render(); } }
  },1000);
}
function stopCountdown(){
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer=null;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* Init */
render();
</script>
