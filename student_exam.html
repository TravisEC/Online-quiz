<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<title>IT ExamPro — Student Exam</title>
<style>
:root{--dark:#0f172a;--dark2:#1e293b;--dark3:#334155;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--dark);color:#e2e8f0;min-height:100vh;}
.header{background:linear-gradient(135deg,#1e3a5f,#1e293b);border-bottom:2px solid #334155;padding:1rem 1.5rem;position:sticky;top:0;z-index:100;}
.header-inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;}
.header-title{font-size:1.1rem;font-weight:900;color:#fff;}
.header-sub{font-size:.75rem;color:#94a3b8;margin-top:2px;}
.timer-box{background:#0f172a;border:2px solid var(--yellow);border-radius:10px;padding:.4rem 1rem;font-size:1.3rem;font-weight:900;font-family:monospace;color:var(--yellow);}
.timer-box.danger{border-color:var(--red);color:var(--red);animation:pulse .5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.main{max-width:900px;margin:0 auto;padding:1.5rem;}
.info-card{background:var(--dark2);border:1px solid var(--dark3);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem;}
.info-card h2{font-size:1rem;font-weight:900;color:#fff;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--dark3);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.fi-label{font-size:.72rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
.fi{width:100%;padding:10px 14px;border:2px solid var(--dark3);border-radius:9px;background:#0f172a;color:#fff;font-size:.95rem;font-weight:600;outline:none;transition:border-color .2s;}
.fi:focus{border-color:var(--blue);}
select.fi{cursor:pointer;}
select.fi option{background:var(--dark2);}
select.fi optgroup{color:#94a3b8;font-size:.75rem;}
.section{background:var(--dark2);border:1px solid var(--dark3);border-radius:14px;padding:1.5rem;margin-bottom:1.2rem;}
.section-heading{display:flex;align-items:center;gap:.7rem;margin-bottom:1.2rem;padding-bottom:.7rem;border-bottom:1px solid var(--dark3);}
.section-heading h3{font-size:1rem;font-weight:900;color:#fff;}
.section-badge{background:var(--blue);color:#fff;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;}
.section-marks{font-size:.75rem;color:#64748b;margin-left:auto;}
.question{margin-bottom:1.4rem;padding-bottom:1.4rem;border-bottom:1px solid #1e293b;}
.question:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.q-num{font-size:.72rem;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;}
.q-text{font-size:.95rem;font-weight:700;color:#e2e8f0;margin-bottom:.8rem;line-height:1.5;}
.q-marks{font-size:.72rem;color:var(--yellow);font-weight:700;margin-bottom:.6rem;}
.opts{display:flex;flex-direction:column;gap:.5rem;}
.opt{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;border:2px solid var(--dark3);border-radius:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--blue);background:rgba(59,130,246,.08);}
.opt input[type=radio],.opt input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px;flex-shrink:0;}
.opt.selected{border-color:var(--blue);background:rgba(59,130,246,.12);}
.opt.correct{border-color:var(--green);background:rgba(34,197,94,.12);}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.08);opacity:.6;}
.opt-label{font-size:.9rem;font-weight:600;color:#e2e8f0;}
.opt-letter{font-size:.8rem;font-weight:900;color:var(--blue);min-width:20px;}
.tf-opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.tf-btn{padding:1rem;border:2px solid var(--dark3);border-radius:10px;font-weight:800;font-size:.95rem;cursor:pointer;text-align:center;transition:all .15s;background:transparent;color:#e2e8f0;}
.tf-btn.selected,.tf-true.selected{border-color:var(--green);background:rgba(34,197,94,.15);color:var(--green);}
.tf-false.selected{border-color:var(--red);background:rgba(239,68,68,.15);color:var(--red);}
.tf-btn.correct{border-color:var(--green);background:rgba(34,197,94,.2);}
.tf-btn.wrong{border-color:var(--red);opacity:.5;}
.fi-ans{width:100%;padding:10px 14px;border:2px solid var(--dark3);border-radius:9px;background:#0f172a;color:#fff;font-size:.95rem;font-weight:600;outline:none;transition:border-color .2s;resize:vertical;}
.fi-ans:focus{border-color:var(--blue);}
.fi-ans:disabled{opacity:.7;cursor:not-allowed;}
.match-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.5rem;align-items:center;}
.match-left{font-size:.88rem;font-weight:700;color:#e2e8f0;background:var(--dark3);padding:.6rem .9rem;border-radius:8px;}
.answer-key{font-size:.78rem;color:var(--green);font-weight:700;margin-top:.4rem;padding:.4rem .8rem;background:rgba(34,197,94,.1);border-radius:6px;border:1px solid rgba(34,197,94,.3);}
.your-answer{font-size:.78rem;color:#94a3b8;font-weight:600;margin-top:.3rem;}
.submit-bar{background:var(--dark2);border:1px solid var(--dark3);border-radius:14px;padding:1.2rem 1.5rem;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;}
.progress-info{font-size:.82rem;color:#64748b;font-weight:700;}
.progress-info span{color:#fff;}
.btn-submit{padding:12px 32px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:900;cursor:pointer;transition:all .15s;font-family:inherit;}
.btn-submit:hover{background:#16a34a;}
.btn-submit:disabled{background:#334155;color:#64748b;cursor:not-allowed;}
.result-banner{background:linear-gradient(135deg,#1e3a5f,#1e293b);border:1px solid var(--dark3);border-radius:14px;padding:2rem;text-align:center;margin-bottom:1.5rem;}
.result-score{font-size:3rem;font-weight:900;color:var(--yellow);}
.result-grade{font-size:1.2rem;font-weight:800;margin-top:.3rem;}
.result-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.5rem;}
.result-meta-item{background:rgba(0,0,0,.2);border-radius:10px;padding:.8rem;}
.result-meta-label{font-size:.7rem;color:#64748b;font-weight:700;text-transform:uppercase;margin-bottom:.3rem;}
.result-meta-val{font-size:1rem;font-weight:900;color:#fff;}
.alert{padding:1rem 1.5rem;border-radius:10px;font-weight:700;font-size:.88rem;margin-bottom:1rem;display:none;}
.alert.show{display:block;}
.alert-red{background:rgba(239,68,68,.15);border:1px solid var(--red);color:var(--red);}
.alert-green{background:rgba(34,197,94,.15);border:1px solid var(--green);color:var(--green);}
.review-header{background:var(--dark2);border:1px solid var(--dark3);border-radius:14px;padding:1rem 1.5rem;margin-bottom:1.2rem;font-weight:800;font-size:.9rem;color:#94a3b8;}
@media(max-width:600px){
  .info-grid{grid-template-columns:1fr;}
  .match-row{grid-template-columns:1fr;}
  .result-meta{grid-template-columns:1fr 1fr;}
  .header-inner{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* EXAM CONFIG — injected by admin panel Save & Push */
var EXAM_CONFIG = {
  "meta": {
    "title": "Grade 7 assessment 3",
    "subject": "Information Technology",
    "grade": "7",
    "duration": 45,
    "term": "Term 3",
    "marks": 25
  },
  "mcq": [
    {
      "q": "What is a digital footprint?",
      "marks": 2,
      "opts": [
        "A virus that damages your computer",
        "The trail of data you leave behind when you use the internet",
        "The memory space used by your photos",

      ],
      "ans": 1
    },
    {

      "marks": 2,

      ],
      "ans": 1
    },
    {

      ],
      "ans": 1
    },
    {
      "q": "Which term refers to the laws that govern the use of technology and the internet?",

        "Digital etiquette",

      "ans": 1
    }
  ],
  "trueFalse": [
    {
      "q": "A passive digital footprint is information you KNOWINGLY share online.",
      "marks": 2,
      "ans": false
    },
    {
      "q": "Once something is posted online it can be very difficult to remove permanently.",
      "marks": 2,
      "ans": true
    },
    {
      "q": "Using digital devices late at night can make it harder to fall asleep.",
      "marks": 2,
      "ans": true
    },
    {
      "q": "The blue light from screens can make it harder for your brain to know it is time to sleep.",
      "marks": 2,
      "ans": true
    },
    {
      "q": "Laws exist to protect individuals from the misuse of their personal data online.",
      "marks": 1,
      "ans": true
    },
    {
      "q": "Hacking into a computer system without permission is legal as long as no data is stolen.",
      "marks": 1,
      "ans": false
    }
  ],
  "fillBlank": [
    {
      "q": "Information you knowingly share online, such as posting on social media, is an ______ digital footprint.",
      "marks": 1,
      "ans": "active"
    }
  ],
  "matching": [],
  "multiSelect": [
    {
      "q": "Which of the following are NEGATIVE effects of excessive screen time on mental health? (Select ALL that apply)",
      "marks": 3,
      "opts": [
        "Social media anxiety",
        "Improved problem-solving skills",
        "Social isolation",
        "Addiction to online activities"
      ],
      "correct": [
        0,
        2,
        3
      ]
    },
    {
      "q": "Which of the following actions could be illegal under ICT legislation? (Select ALL that apply)",
      "marks": 3,
      "opts": [
        "Hacking into a school database",
        "Browsing a public website",
        "Selling customers' data without consent",
        "Copying and selling software illegally",
        "Sending an email to a friend"
      ],
      "correct": [
        0,
        2,
        3
      ]
    }
  ],
  "essay": []
};

/* ── CONFIG ── */
var SURL = 'https://script.google.com/macros/s/AKfycbxrrDxbVlTP1u5oyR776zVOfG3gTMK1mIPFeh9qFIbTFYaOA8RL5tFseH99-c0JTq7p/exec';
var L = ['A','B','C','D','E','F'];

/* ── STATE ── */
var answers  = {};
var submitted = false;
var reviewing = false;
var timerInterval = null;
var timeLeft = 0;
var autoScore = 0;
var sName = '';
var sCls  = '';
var sSid  = '';

/* ── NORMALIZE CONFIG ── */
function getCfg(){
  var c = EXAM_CONFIG;
  return {
    meta:  c.meta||{},
    mcq:   c.mcq||[],
    tf:    c.trueFalse||c.tf||[],
    fill:  c.fillBlank||c.fill||[],
    match: c.matching||c.match||[],
    ms:    c.multiSelect||c.ms||[],
    essay: c.essay||[]
  };
}

/* ── RENDER ── */
function render(){
  var el = document.getElementById('app');
  if(submitted && !reviewing){ el.innerHTML = renderResult(); return; }
  var cfg = getCfg();
  var meta = cfg.meta;
  var h = '';

  /* Header */
  h += '<div class="header"><div class="header-inner">';
  h += '<div><div class="header-title">'+esc(meta.title||'Exam')+'</div>';
  h += '<div class="header-sub">'+esc(meta.subject||'')+(meta.grade?' &nbsp;·&nbsp; Grade '+esc(meta.grade):'')+(meta.term?' &nbsp;·&nbsp; '+esc(meta.term):'')+'</div></div>';
  h += '<div class="timer-box" id="timer-display">'+(submitted?'Done':'--:--')+'</div>';
  h += '</div></div>';
  h += '<div class="main">';
  h += '<div id="alert-box" class="alert"></div>';

  if(submitted && reviewing){
    h += '<div class="review-header">📋 Review — Your answers are shown below with correct answers highlighted in green.</div>';
  }

  /* Student info */
  if(!submitted){
    h += '<div class="info-card"><h2>📋 Student Information</h2>';
    h += '<div class="info-grid">';
    h += '<div><div class="fi-label">Full Name</div><input class="fi" id="s-name" type="text" placeholder="e.g. John Smith" autocomplete="off" value="'+esc(sName)+'"></div>';
    h += '<div><div class="fi-label">Student ID</div><input class="fi" id="s-id" type="text" placeholder="e.g. 2024001" autocomplete="off" value="'+esc(sSid)+'"></div>';
    h += '<div><div class="fi-label">Class</div>';
    h += '<select class="fi" id="s-cls">';
    h += '<option value="">-- Select Class --</option>';
    h += '<optgroup label="Grade 7"><option'+(sCls==='7-1'?' selected':'')+'>7-1</option><option'+(sCls==='7-2'?' selected':'')+'>7-2</option><option'+(sCls==='7-3'?' selected':'')+'>7-3</option><option'+(sCls==='7-4'?' selected':'')+'>7-4</option></optgroup>';
    h += '<optgroup label="Grade 8"><option'+(sCls==='8-1'?' selected':'')+'>8-1</option><option'+(sCls==='8-2'?' selected':'')+'>8-2</option><option'+(sCls==='8-3'?' selected':'')+'>8-3</option><option'+(sCls==='8-4'?' selected':'')+'>8-4</option></optgroup>';
    h += '<optgroup label="Grade 9"><option'+(sCls==='9-1'?' selected':'')+'>9-1</option><option'+(sCls==='9-2'?' selected':'')+'>9-2</option><option'+(sCls==='9-3'?' selected':'')+'>9-3</option><option'+(sCls==='9-4'?' selected':'')+'>9-4</option></optgroup>';
    h += '<optgroup label="Grade 10"><option'+(sCls==='10 Arts'?' selected':'')+'>10 Arts</option><option'+(sCls==='10 Business'?' selected':'')+'>10 Business</option><option'+(sCls==='10 TVET 1'?' selected':'')+'>10 TVET 1</option><option'+(sCls==='10 TVET 2'?' selected':'')+'>10 TVET 2</option><option'+(sCls==='10 CVQ 1'?' selected':'')+'>10 CVQ 1</option><option'+(sCls==='10 CVQ 2'?' selected':'')+'>10 CVQ 2</option></optgroup>';
    h += '<optgroup label="Grade 11"><option'+(sCls==='11 Arts'?' selected':'')+'>11 Arts</option><option'+(sCls==='11 Business'?' selected':'')+'>11 Business</option><option'+(sCls==='11 TVET 1'?' selected':'')+'>11 TVET 1</option><option'+(sCls==='11 TVET 2'?' selected':'')+'>11 TVET 2</option><option'+(sCls==='11 CVQ 1'?' selected':'')+'>11 CVQ 1</option><option'+(sCls==='11 CVQ 2'?' selected':'')+'>11 CVQ 2</option></optgroup>';
    h += '</select></div>';
    h += '<div><div class="fi-label">Date</div><input class="fi" id="s-date" type="date" value="'+new Date().toISOString().split("T")[0]+'"></div>';
    h += '</div></div>';
  }

  /* Sections */
  var qNum = 0;
  var totalMarks = 0;
  var cfg = getCfg();

  if(cfg.mcq.length){
    var sm = cfg.mcq.reduce(function(s,q){return s+(q.marks||1);},0); totalMarks+=sm;
    h += '<div class="section"><div class="section-heading"><h3>Section A — Multiple Choice</h3><span class="section-badge">MCQ</span><span class="section-marks">'+sm+' marks</span></div>';
    cfg.mcq.forEach(function(q,i){ qNum++; h += renderMCQ(q,i,qNum); });
    h += '</div>';
  }
  if(cfg.tf.length){
    var sm = cfg.tf.reduce(function(s,q){return s+(q.marks||1);},0); totalMarks+=sm;
    h += '<div class="section"><div class="section-heading"><h3>Section B — True or False</h3><span class="section-badge">T/F</span><span class="section-marks">'+sm+' marks</span></div>';
    cfg.tf.forEach(function(q,i){ qNum++; h += renderTF(q,i,qNum); });
    h += '</div>';
  }
  if(cfg.fill.length){
    var sm = cfg.fill.reduce(function(s,q){return s+(q.marks||1);},0); totalMarks+=sm;
    h += '<div class="section"><div class="section-heading"><h3>Section C — Fill in the Blank</h3><span class="section-badge">Fill</span><span class="section-marks">'+sm+' marks</span></div>';
    cfg.fill.forEach(function(q,i){ qNum++; h += renderFill(q,i,qNum); });
    h += '</div>';
  }
  if(cfg.match.length){
    var sm = cfg.match.reduce(function(s,q){return s+(q.marks||1);},0); totalMarks+=sm;
    h += '<div class="section"><div class="section-heading"><h3>Section D — Matching</h3><span class="section-badge">Match</span><span class="section-marks">'+sm+' marks</span></div>';
    cfg.match.forEach(function(q,i){ qNum++; h += renderMatch(q,i,qNum); });
    h += '</div>';
  }
  if(cfg.ms.length){
    var sm = cfg.ms.reduce(function(s,q){return s+(q.marks||1);},0); totalMarks+=sm;
    h += '<div class="section"><div class="section-heading"><h3>Section E — Multiple Select</h3><span class="section-badge">Multi</span><span class="section-marks">'+sm+' marks</span></div>';
    cfg.ms.forEach(function(q,i){ qNum++; h += renderMS(q,i,qNum); });
    h += '</div>';
  }
  if(cfg.essay.length){
    var sm = cfg.essay.reduce(function(s,q){return s+(q.marks||1);},0); totalMarks+=sm;
    h += '<div class="section"><div class="section-heading"><h3>Section F — Short Answer / Essay</h3><span class="section-badge">Essay</span><span class="section-marks">'+sm+' marks</span></div>';
    cfg.essay.forEach(function(q,i){ qNum++; h += renderEssay(q,i,qNum); });
    h += '</div>';
  }

  if(!submitted){
    h += '<div class="submit-bar">';
    h += '<div class="progress-info">Total: <span>'+totalMarks+' marks</span> &nbsp;·&nbsp; Questions: <span>'+qNum+'</span></div>';
    h += '<button class="btn-submit" id="submit-btn">Submit Exam ✓</button>';
    h += '</div>';
  }

  h += '</div>';
  el.innerHTML = h;

  if(!submitted){
    wireOptions();
    document.getElementById('submit-btn').addEventListener('click', function(){ submitExam(false); });
    startTimer(meta.duration||0);
  }
}

/* ── QUESTION RENDERERS ── */
function renderMCQ(q,i,num){
  var myAns = answers['mcq_'+i];
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+'</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  h += '<div class="opts" id="mcq-opts-'+i+'">';
  (q.opts||[]).forEach(function(opt,j){
    var isSelected = myAns===j;
    var isCorrect  = submitted && j===q.ans;
    var isWrong    = submitted && isSelected && j!==q.ans;
    var cls = 'opt'+(isSelected?' selected':'')+(isCorrect?' correct':'')+(isWrong?' wrong':'');
    h += '<label class="'+cls+'" data-type="mcq" data-qi="'+i+'" data-val="'+j+'">';
    h += '<input type="radio" name="mcq-'+i+'" value="'+j+'"'+(isSelected?' checked':'')+(submitted?' disabled':'')+'>';
    h += '<span class="opt-letter">'+L[j]+'</span>';
    h += '<span class="opt-label">'+esc(opt)+'</span>';
    if(isCorrect && submitted) h += ' <span style="color:var(--green);font-size:.75rem;font-weight:800;">✓ Correct</span>';
    h += '</label>';
  });
  h += '</div>';
  if(submitted && myAns!==undefined && myAns!==q.ans){
    h += '<div class="answer-key">✅ Correct answer: '+L[q.ans]+') '+esc((q.opts||[])[q.ans])+'</div>';
  }
  h += '</div>';
  return h;
}

function renderTF(q,i,num){
  var myAns = answers['tf_'+i];
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+'</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  h += '<div class="tf-opts">';
  var trueSelected = myAns===true;
  var falseSelected = myAns===false;
  var trueCls = 'tf-btn tf-true'+(trueSelected?' selected':'')+(submitted&&q.ans===true?' correct':'')+(submitted&&trueSelected&&q.ans!==true?' wrong':'');
  var falseCls = 'tf-btn tf-false'+(falseSelected?' selected':'')+(submitted&&q.ans===false?' correct':'')+(submitted&&falseSelected&&q.ans!==false?' wrong':'');
  h += '<button class="'+trueCls+'" data-type="tf" data-qi="'+i+'" data-val="true"'+(submitted?' disabled':'')+' onclick="selectTF(this,\'tf\','+i+',true)">✓ True</button>';
  h += '<button class="'+falseCls+'" data-type="tf" data-qi="'+i+'" data-val="false"'+(submitted?' disabled':'')+' onclick="selectTF(this,\'tf\','+i+',false)">✗ False</button>';
  h += '</div>';
  if(submitted && myAns!==undefined && myAns!==q.ans){
    h += '<div class="answer-key">✅ Correct answer: '+(q.ans?'True':'False')+'</div>';
  }
  h += '</div>';
  return h;
}

function renderFill(q,i,num){
  var myAns = answers['fill_'+i]||'';
  var correct = submitted && myAns.trim().toLowerCase()===(q.ans||'').trim().toLowerCase();
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+'</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  h += '<input class="fi-ans" id="fill-'+i+'" type="text" placeholder="Type your answer here..." value="'+esc(myAns)+'" '+(submitted?'disabled':'')+' oninput="answers[\'fill_\'+'+i+']=this.value">';
  if(submitted){
    if(correct) h += '<div class="answer-key">✅ Correct!</div>';
    else h += '<div class="answer-key">✅ Correct answer: '+esc(q.ans)+'</div>';
  }
  h += '</div>';
  return h;
}

function renderMatch(q,i,num){
  var myAns = answers['match_'+i]||{};
  var rights = (q.pairs||[]).map(function(p){return p.right;}).slice();
  if(!submitted) rights.sort(function(){return Math.random()-.5;});
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+' — Match each item</div>';
  h += '<div class="q-text">'+esc(q.title||q.q||'Match the following:')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  (q.pairs||[]).forEach(function(p,j){
    h += '<div class="match-row">';
    h += '<div class="match-left">'+esc(p.left)+'</div>';
    if(submitted){
      var myVal = myAns[j]||'(No answer)';
      var isRight = myVal===p.right;
      h += '<div style="padding:.5rem .9rem;border-radius:8px;font-weight:700;font-size:.88rem;background:'+(isRight?'rgba(34,197,94,.15)':'rgba(239,68,68,.1)')+';border:1px solid '+(isRight?'var(--green)':'var(--red)')+';">'+esc(myVal)+'</div>';
      if(!isRight) h += '<div class="answer-key" style="grid-column:1/-1;">✅ Correct: '+esc(p.right)+'</div>';
    } else {
      h += '<select class="fi" id="match-'+i+'-'+j+'" onchange="setMatchAns('+i+','+j+',this.value)">';
      h += '<option value="">-- Select --</option>';
      rights.forEach(function(r){ h += '<option value="'+esc(r)+'"'+(myAns[j]===r?' selected':'')+'>'+esc(r)+'</option>'; });
      h += '</select>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function renderMS(q,i,num){
  var myAns = answers['ms_'+i]||[];
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+' — Select all that apply</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  h += '<div class="opts" id="ms-opts-'+i+'">';
  (q.opts||[]).forEach(function(opt,j){
    var isSelected = myAns.indexOf(j)>=0;
    var isCorrect  = submitted && (q.correct||[]).indexOf(j)>=0;
    var isWrong    = submitted && isSelected && (q.correct||[]).indexOf(j)<0;
    var cls = 'opt'+(isSelected?' selected':'')+(isCorrect?' correct':'')+(isWrong?' wrong':'');
    h += '<label class="'+cls+'" data-type="ms" data-qi="'+i+'" data-val="'+j+'">';
    h += '<input type="checkbox" name="ms-'+i+'" value="'+j+'"'+(isSelected?' checked':'')+(submitted?' disabled':'')+'>';
    h += '<span class="opt-letter">'+L[j]+'</span>';
    h += '<span class="opt-label">'+esc(opt)+'</span>';
    if(isCorrect && submitted) h += ' <span style="color:var(--green);font-size:.75rem;font-weight:800;">✓</span>';
    h += '</label>';
  });
  h += '</div></div>';
  return h;
}

function renderEssay(q,i,num){
  var myAns = answers['essay_'+i]||'';
  var h = '<div class="question">';
  h += '<div class="q-num">Question '+num+'</div>';
  h += '<div class="q-text">'+esc(q.q||q.title||'')+'</div>';
  if(q.key && submitted) h += '<div class="answer-key">✅ Key points: '+esc(q.key)+'</div>';
  h += '<div class="q-marks">('+(q.marks||1)+' mark'+(q.marks>1?'s':'')+')</div>';
  h += '<textarea class="fi-ans" id="essay-'+i+'" rows="4" placeholder="Write your answer here..." '+(submitted?'disabled':'')+' oninput="answers[\'essay_\'+'+i+']=this.value">'+esc(myAns)+'</textarea>';
  h += '</div>';
  return h;
}

/* ── RESULT SCREEN ── */
function renderResult(){
  var cfg = getCfg();
  var meta = cfg.meta;
  var totalMarks = calcTotalMarks();
  var pct = totalMarks>0 ? Math.round(autoScore/totalMarks*100) : 0;
  var grade = pct>=80?'A':pct>=70?'B':pct>=60?'C':pct>=50?'D':'F';
  var emoji = pct>=80?'🏆':pct>=60?'🎉':pct>=50?'👍':'📚';

  var h = '<div class="header"><div class="header-inner">';
  h += '<div><div class="header-title">'+esc(meta.title||'Exam')+'</div>';
  h += '<div class="header-sub">Submitted successfully</div></div>';
  h += '<div class="timer-box">Done ✓</div>';
  h += '</div></div>';
  h += '<div class="main">';
  h += '<div class="result-banner">';
  h += '<div style="font-size:2.5rem;margin-bottom:.5rem;">'+emoji+'</div>';
  h += '<div class="result-score">'+autoScore+' / '+totalMarks+'</div>';
  h += '<div class="result-grade" style="color:'+(grade==='A'?'var(--green)':grade==='F'?'var(--red)':'var(--yellow)')+';">Grade '+grade+' &nbsp;·&nbsp; '+pct+'%</div>';
  h += '<div class="result-meta">';
  h += '<div class="result-meta-item"><div class="result-meta-label">Name</div><div class="result-meta-val">'+esc(sName||'—')+'</div></div>';
  h += '<div class="result-meta-item"><div class="result-meta-label">Class</div><div class="result-meta-val">'+esc(sCls||'—')+'</div></div>';
  h += '<div class="result-meta-item"><div class="result-meta-label">Subject</div><div class="result-meta-val">'+esc(meta.subject||'IT')+'</div></div>';
  h += '</div>';
  h += '<div style="margin-top:1rem;font-size:.78rem;color:#64748b;">Essay & Matching questions are marked by your teacher</div>';
  h += '<div style="margin-top:1rem;">';
  h += '<button class="btn-submit" onclick="reviewExam()" style="background:var(--blue);">📋 Review My Answers</button>';
  h += '</div>';
  h += '</div></div>';
  return h;
}

/* ── WIRE CLICKS ── */
function wireOptions(){
  document.querySelectorAll('.opt').forEach(function(el){
    el.addEventListener('click', function(){
      if(submitted) return;
      var type = el.dataset.type;
      var qi   = parseInt(el.dataset.qi);
      var val  = parseInt(el.dataset.val);
      if(type==='mcq'){
        document.querySelectorAll('#mcq-opts-'+qi+' .opt').forEach(function(o){o.classList.remove('selected');});
        el.classList.add('selected');
        el.querySelector('input').checked = true;
        answers['mcq_'+qi] = val;
      } else if(type==='ms'){
        el.classList.toggle('selected');
        var cb = el.querySelector('input');
        cb.checked = !cb.checked;
        var sel = [];
        document.querySelectorAll('#ms-opts-'+qi+' input:checked').forEach(function(c){sel.push(parseInt(c.value));});
        answers['ms_'+qi] = sel;
      }
    });
  });
}

function selectTF(btn,type,qi,val){
  if(submitted) return;
  btn.parentElement.querySelectorAll('.tf-btn').forEach(function(b){b.classList.remove('selected');});
  btn.classList.add('selected');
  answers['tf_'+qi] = val;
}

function setMatchAns(qi,j,val){
  if(!answers['match_'+qi]) answers['match_'+qi]={};
  answers['match_'+qi][j] = val;
}

/* ── TIMER ── */
function startTimer(minutes){
  if(!minutes || parseInt(minutes)<=0){
    var td = document.getElementById('timer-display');
    if(td) td.textContent = 'No limit';
    return;
  }
  timeLeft = parseInt(minutes) * 60;
  if(timerInterval) clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(function(){
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){ clearInterval(timerInterval); submitExam(true); }
  },1000);
}

function updateTimerDisplay(){
  var el = document.getElementById('timer-display');
  if(!el) return;
  var m = Math.floor(timeLeft/60);
  var s = timeLeft%60;
  el.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  if(timeLeft<=120) el.classList.add('danger');
  else el.classList.remove('danger');
}

/* ── SCORE ── */
function calcAutoScore(){
  var cfg = getCfg(); var score = 0;
  cfg.mcq.forEach(function(q,i){ if(answers['mcq_'+i]===q.ans) score+=(q.marks||1); });
  cfg.tf.forEach(function(q,i){ if(String(answers['tf_'+i])===String(q.ans)) score+=(q.marks||1); });
  cfg.fill.forEach(function(q,i){
    var a=String(answers['fill_'+i]||'').trim().toLowerCase();
    var k=String(q.ans||'').trim().toLowerCase();
    if(a&&a===k) score+=(q.marks||1);
  });
  cfg.ms.forEach(function(q,i){
    if((answers['ms_'+i]||[]).slice().sort().join(',') === (q.correct||[]).slice().sort().join(',')) score+=(q.marks||1);
  });
  return score;
}

function calcTotalMarks(){
  var cfg = getCfg();
  return ['mcq','tf','fill','match','ms','essay'].reduce(function(s,t){
    return s+(cfg[t]||[]).reduce(function(ss,q){return ss+(q.marks||1);},0);
  },0);
}

/* ── SUBMIT ── */
async function submitExam(auto){
  if(submitted) return;
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }

  /* Read student info from DOM FIRST before anything else */
  var nameEl = document.getElementById('s-name');
  var sidEl  = document.getElementById('s-id');
  var clsEl  = document.getElementById('s-cls');
  var dateEl = document.getElementById('s-date');

  var name = nameEl ? nameEl.value : '';
  var sid  = sidEl  ? sidEl.value  : '';
  var cls  = clsEl  ? clsEl.value  : '';
  var date = dateEl ? dateEl.value  : '';

  /* Validate */
  if(!auto){
    if(!name.trim()){ showAlert('Please enter your full name.','red'); return; }
    if(!cls){ showAlert('Please select your class.','red'); return; }
  }

  /* Store in globals IMMEDIATELY */
  sName = name.trim() || '(No name)';
  sCls  = cls || '—';
  sSid  = sid.trim();

  var cfg = getCfg();
  var meta = cfg.meta;
  autoScore = calcAutoScore();
  var totalMarks = calcTotalMarks();

  /* Build payload */
  var payload = {
    'Exam Title':  meta.title||'Exam',
    'Exam Grade':  meta.grade||'',
    'Exam Term':   meta.term||'',
    'Name':        sName,
    'Student ID':  sSid,
    'Class':       sCls,
    'Date':        date,
    'Auto Score':  autoScore,
    'Total Marks': totalMarks
  };

  cfg.mcq.forEach(function(q,i){
    var val=answers['mcq_'+i];
    payload['MCQ Q'+(i+1)] = val!==undefined ? L[val]+') '+(q.opts||[])[val] : '(No answer)';
  });
  cfg.tf.forEach(function(q,i){
    var val=answers['tf_'+i];
    payload['TF Q'+(i+1)] = val!==undefined ? (val?'True':'False') : '(No answer)';
  });
  cfg.fill.forEach(function(q,i){
    payload['Fill Q'+(i+1)] = answers['fill_'+i]||'(No answer)';
  });
  cfg.match.forEach(function(q,i){
    var m=answers['match_'+i]||{};
    payload['Match Q'+(i+1)] = (q.pairs||[]).map(function(p,j){return p.left+' → '+(m[j]||'?');}).join(' | ');
  });
  cfg.ms.forEach(function(q,i){
    var val=answers['ms_'+i]||[];
    payload['MS Q'+(i+1)] = val.length ? val.map(function(v){return L[v]+') '+(q.opts||[])[v];}).join(', ') : '(No answer)';
  });
  cfg.essay.forEach(function(q,i){
    payload['Essay Q'+(i+1)] = answers['essay_'+i]||'(No answer)';
  });

  showAlert('Submitting...','');
  try{
    var params = Object.keys(payload).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(payload[k]);
    }).join('&');
    await fetch(SURL+'?action=submit&'+params+'&t='+Date.now(),{method:'GET',mode:'cors'});
  }catch(e){ console.warn('Submit error:',e); }

  submitted = true;
  render();
}

/* ── REVIEW ── */
function reviewExam(){
  reviewing = true;
  render();
}

/* ── HELPERS ── */
function showAlert(msg,type){
  var el=document.getElementById('alert-box');
  if(!el) return;
  el.textContent=msg;
  el.className='alert show'+(type==='red'?' alert-red':type==='green'?' alert-green':'');
  if(type) setTimeout(function(){el.classList.remove('show');},4000);
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── INIT ── */
render();
</script>
